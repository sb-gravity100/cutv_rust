[package]
name = "cutv_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe      = "0.29"
egui        = "0.29"
rodio       = { version = "0.18", features = ["symphonia-mp3"] }
serde_json  = "1"
anyhow      = "1"
log         = "0.4"
env_logger  = "0.11"
chrono      = { version = "0.4", features = ["clock"] }
windows     = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level       = 3
lto             = "thin"
codegen-units   = 1
strip           = true
