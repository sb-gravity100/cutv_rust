[package]
name = "cutv_rust"
version = "0.1.3"
edition = "2024"
default-run = "cutv_rust"

[dependencies]
eframe      = "0.29"
egui        = "0.29"
rodio       = { version = "0.18", features = ["symphonia-mp3"] }
anyhow      = "1"
log         = "0.4"
env_logger  = "0.11"
chrono      = { version = "0.4", features = ["clock"] }
windows     = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }
raw-window-handle = "0.6"
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.3"
gifski = { version = "1.34.0", default-features = false }
rfd    = "0.15"
ffmpeg-next = "9.0.0"
# auto-updater (src/updater.rs)
ureq          = { version = "2", features = ["json"] }
serde         = { version = "1", features = ["derive"] }
base64        = "0.22"
ed25519-dalek = "2"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level       = 3
lto             = "thin"
codegen-units   = 1
strip           = true
